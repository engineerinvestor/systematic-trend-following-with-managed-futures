# Cryptocurrency spot reference universe.
#
# These are spot reference series used to compute signals. point_value is 1 and
# contract_step is fractional because spot is sized in coins, not contracts.
# For a CME futures implementation use tf.data.cme_crypto.build_universe(),
# which carries contract sizes, tick sizes, and the venue session calendar.
#
# These entries carry no listing_date: for spot series the point-in-time
# eligibility rule keys on when price history actually begins, which the
# min_history rule reads directly from the data. CME futures listing dates
# live in tf.data.cme_crypto and apply to futures-implemented universes.
# No market data ships with this repository; see docs/CRYPTO_DATA.md.
symbols:
  - symbol: BTC
    sector: Crypto
    point_value: 1.0
    contract_step: 0.0001
    calendar: CRYPTO_DAILY
    data_source: yahoo
    data_symbol: BTC-USD
    description: Bitcoin spot reference price
  - symbol: ETH
    sector: Crypto
    point_value: 1.0
    contract_step: 0.001
    calendar: CRYPTO_DAILY
    data_source: yahoo
    data_symbol: ETH-USD
    description: Ether spot reference price
  - symbol: SOL
    sector: Crypto
    point_value: 1.0
    contract_step: 0.01
    calendar: CRYPTO_DAILY
    data_source: yahoo
    data_symbol: SOL-USD
    description: Solana spot reference price
  - symbol: XRP
    sector: Crypto
    point_value: 1.0
    contract_step: 1.0
    calendar: CRYPTO_DAILY
    data_source: yahoo
    data_symbol: XRP-USD
    description: XRP spot reference price
