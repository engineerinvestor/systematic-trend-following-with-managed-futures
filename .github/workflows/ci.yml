name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # The pandas pin floats across a major version boundary; test both
        # majors so a removed API cannot pass CI on one and crash on the other.
        pandas: ["pandas>=2.2,<3", "pandas>=3,<4"]
        exclude:
          # pandas 3 requires Python >= 3.11.
          - python-version: "3.10"
            pandas: "pandas>=3,<4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "${{ matrix.pandas }}"

      # The suite runs on synthetic and fixture data only. Nothing here fetches
      # market data, so CI cannot fail because a vendor is down or a licence
      # changed, and no market data enters the repository.
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
